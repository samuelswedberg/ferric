[package]
name = "ferric-spotify"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait.workspace = true
ferric-core = { path = "../ferric-core" }
keyring = { version = "3.6.3", features = ["windows-native"] }
log = { version = "0.4.35", features = ["max_level_warn", "release_max_level_warn"] }
open = "5.3.3"
rspotify = { version = "0.16.1", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny_http = "0.12.0"
tokio.workspace = true
tracing.workspace = true
url = "2.5.7"
