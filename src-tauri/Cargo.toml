[package]
name = "ferric-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "ferric_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
ferric-core = { path = "../crates/ferric-core" }
ferric-media = { path = "../crates/ferric-media" }
ferric-spotify = { path = "../crates/ferric-spotify" }
ferric-theme = { path = "../crates/ferric-theme" }
notify = "8"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener.workspace = true
tauri-plugin-window-state.workspace = true
tokio = { workspace = true, features = ["fs"] }
toml = "1"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
