[workspace]
members = [
    "crates/ferric-core",
    "crates/ferric-media",
    "crates/ferric-spotify",
    "crates/ferric-theme",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samuelswedberg/ferric"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.7"
tauri-build = "2.7.6"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
window-vibrancy = "0.8.1"
