name: Bug report
description: Something in Ferric doesn't work right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferric version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: signed-in
    attributes:
      label: Signed in to Spotify in Ferric?
      options: ["No", "Yes, free account", "Yes, Premium"]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11 24H2, 125%
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "From %LOCALAPPDATA%\\dev.ferric.app\\logs. Remove anything personal first."
      render: text
