version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-deps: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      ui-deps: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
